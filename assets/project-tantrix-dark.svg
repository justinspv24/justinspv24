<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Tantrix puzzle optimisation">
<title>Tantrix puzzle optimisation</title>
<style>
.ct{font:800 27px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;fill:#FFFFFF}
.cm{font:400 18px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;fill:#B3B3B3}
.pill{font:800 14px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;letter-spacing:1px}
.code{font:800 15px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;fill:#FFFFFF;letter-spacing:1px}
.shine{animation:shine 4s ease-in-out infinite;animation-delay:1.0s}
@keyframes shine{0%,100%{opacity:0}45%,55%{opacity:.4}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="598" height="198" rx="16" fill="#262626" stroke="#333333" stroke-width="2"/>
  <rect x="1" y="1" width="12" height="198" rx="6" fill="#FFF000"/>
  <rect x="1" y="1" width="12" height="198" rx="6" fill="#fff" class="shine" opacity="0"/>
  <text x="44" y="60" class="ct">Tantrix puzzle</text><text x="44" y="94" class="ct">optimisation</text>
  <text x="44" y="132" class="cm">Mixed-integer linear programming</text>
  <rect x="44" y="146" width="122" height="32" rx="16" fill="#FFF000"/><text x="105" y="167" class="pill" fill="#000" text-anchor="middle">GRADE 1.3</text><text x="564" y="168" class="code" text-anchor="end">CODE →</text>
</svg>
