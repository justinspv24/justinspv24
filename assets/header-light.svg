<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Justins Pulpakunnel Varkey — quantum computing and machine learning">
<title>Justins Pulpakunnel Varkey — quantum computing and machine learning</title>
<style>
.title{font:800 52px 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', system-ui, Helvetica, Arial, sans-serif;fill:#1a7f37;letter-spacing:1px}
.sub{font:500 20px system-ui, -apple-system, 'Segoe UI', 'Noto Sans', Roboto, Ubuntu, Helvetica, Arial, sans-serif;fill:#1f2328}
.prompt{font:700 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1a7f37}
.role{font:500 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328;opacity:0}
.ket{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#59636e}
.wire{stroke:#d0d7de;stroke-width:2}
.gbox{fill:#1f883d}
.glabel{font:800 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#fff}
.ctl{stroke:#1f883d;stroke-width:2.5}
.cdot{fill:#1f883d}
.tgt{fill:#1f883d}
.plus{stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.meter{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.gate{animation:fire 4.0s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{fill:#1a7f37;filter:url(#glow);animation:travel 4.0s linear infinite}
.sph{fill:none;stroke:#fff;stroke-width:2.2}
.eq{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:5 6;opacity:.85}
.faint{opacity:.4}
.axis{stroke:#fff;stroke-width:1.2;opacity:.5}
.bket{font:700 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#fff}
.psi{font:800 20px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#fff}
.trail{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:3 6;opacity:.5}
.vec{stroke:#fff;stroke-width:4.5;stroke-linecap:round}
.tip{fill:#fff}
.disc{animation:breathe 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translateX(740px);opacity:0}}
@keyframes fire{0%,100%{transform:scale(1)}3%{transform:scale(1.14)}9%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes role{0%{opacity:0;transform:translateY(6px)}2.00%{opacity:1;transform:none}22.00%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.r0{animation:role 14.0s linear infinite;animation-delay:-14.00s}.r1{animation:role 14.0s linear infinite;animation-delay:-10.50s}.r2{animation:role 14.0s linear infinite;animation-delay:-7.00s}.r3{animation:role 14.0s linear infinite;animation-delay:-3.50s}
@media (prefers-reduced-motion: reduce){.r0{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
