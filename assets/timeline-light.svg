<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="Hackathons and quantum work, most recent first">
<title>Hackathons and quantum work, most recent first</title>
<style>
.date{font:700 19px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;fill:#5C5C5C}
.et{font:700 22px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif}
.ed{font:400 17px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif}
.badge{font:800 14px system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Helvetica, Arial, sans-serif;letter-spacing:1px}
.track{stroke:#D4D4D4;stroke-width:3}
.dot{fill:#F7F7F7;stroke:#FFC800;stroke-width:3.5;animation:lit 6.0s linear infinite}
.pulse{fill:#FFC800;filter:url(#glow);animation:down 6.0s linear infinite}
@keyframes down{0%{transform:translateY(0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translateY(648px);opacity:0}}
@keyframes lit{0%,100%{fill:#F7F7F7}2%{fill:#FFC800}10%{fill:#FFC800}16%{fill:#F7F7F7}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="770" rx="18" fill="#F7F7F7"/>
  <line x1="214" y1="64.0" x2="214" y2="712.0" class="track"/>
