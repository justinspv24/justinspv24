<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Justins Pulpakunnel Varkey — quantum computing and machine learning">
  <title>Justins Pulpakunnel Varkey — quantum computing and machine learning</title>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFF000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .title{font:800 50px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#FFF000;letter-spacing:1px}
    .sub{font:500 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#E8E8E8}
    .prompt{font:600 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#FFF000}
    .role{font:500 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#E8E8E8;opacity:0}
    .caret{fill:#FFF000;animation:blink 1s steps(1) infinite}
    .ket{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#9A9A9A}
    .psi{font:600 18px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#FFF000}
    .wire{stroke:#4a4a3a;stroke-width:2}
    .gbox{fill:#232323;stroke:#FFF000;stroke-width:1.6}
    .glabel{font:700 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#FFF000}
    .ctl{stroke:#FFF000;stroke-width:2}
    .dot{fill:#FFF000}
    .tgt{fill:#232323;stroke:#FFF000;stroke-width:2}
    .meter{fill:none;stroke:#FFF000;stroke-width:1.8;stroke-linecap:round}
    .gate{animation:fire 4.0s linear infinite;transform-box:fill-box;transform-origin:center}
    .pulse{fill:#FFF000;filter:url(#glow);animation:travel 4.0s linear infinite}
    .sph{fill:url(#halo);stroke:#8a8a8a;stroke-width:1.6}
    .eq{fill:none;stroke:#8a8a8a;stroke-width:1.2;stroke-dasharray:4 5}
    .faint{opacity:.45}
    .axis{stroke:#8a8a8a;stroke-width:1;opacity:.6}
    .trail{fill:none;stroke:#FFF000;stroke-width:1.4;stroke-dasharray:3 6;opacity:.6}
    .vec{stroke:#FFF000;stroke-width:3.5;stroke-linecap:round;filter:url(#glow)}
    .tip{fill:#FFF000;filter:url(#glow)}
    @keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translateX(740px);opacity:0}}
    @keyframes fire{0%{opacity:1;filter:none}3%{opacity:1;filter:drop-shadow(0 0 6px #FFF000)}10%{filter:none}100%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes role{0%{opacity:0;transform:translateY(6px)}2.00%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0)}25.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
    .r0{animation:role 14.0s linear infinite;animation-delay:-14.00s}.r1{animation:role 14.0s linear infinite;animation-delay:-10.50s}.r2{animation:role 14.0s linear infinite;animation-delay:-7.00s}.r3{animation:role 14.0s linear infinite;animation-delay:-3.50s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.r0{opacity:1}}
  </style>
  <rect width="1200" height="380" rx="18" fill="#161616"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <text x="56" y="112" class="title" textLength="800" lengthAdjust="spacingAndGlyphs">JUSTINS PULPAKUNNEL VARKEY</text>
  <rect x="56" y="128" width="72" height="5" rx="2.5" fill="#FFF000"/>
  <text x="56" y="170" class="sub">M.Sc. Data Science (ML &amp; AI) · FAU Erlangen-Nürnberg · Germany</text>
  <text x="56" y="214" class="prompt">&gt;</text>
  <text class="role r0" x="84" y="214">quantum machine learning</text><text class="role r1" x="84" y="214">quantum circuits on IBM Quantum &amp; IQM hardware</text><text class="role r2" x="84" y="214">optimisation: MILP and quantum-enhanced search</text><text class="role r3" x="84" y="214">deep learning and computer vision</text>
  <line x1="120" y1="268" x2="860" y2="268" class="wire"/><line x1="120" y1="304" x2="860" y2="304" class="wire"/><line x1="120" y1="340" x2="860" y2="340" class="wire"/><text x="106" y="273" class="ket" text-anchor="end">|0⟩</text><text x="106" y="309" class="ket" text-anchor="end">|1⟩</text><text x="106" y="345" class="ket" text-anchor="end">|0⟩</text><circle cx="120" cy="268" r="4.5" class="pulse" style="animation-delay:0s"/><circle cx="120" cy="304" r="4.5" class="pulse" style="animation-delay:0s"/><circle cx="120" cy="340" r="4.5" class="pulse" style="animation-delay:0s"/><g class="gate" style="animation-delay:0.43s"><rect x="183" y="254" width="34" height="28" rx="6" class="gbox"/><text x="200" y="274" class="glabel" text-anchor="middle">H</text></g><g class="gate" style="animation-delay:0.43s"><rect x="183" y="326" width="34" height="28" rx="6" class="gbox"/><text x="200" y="346" class="glabel" text-anchor="middle">X</text></g><g class="gate" style="animation-delay:0.97s"><line x1="300" y1="268" x2="300" y2="315" class="ctl"/><circle cx="300" cy="268" r="5" class="dot"/><circle cx="300" cy="304" r="11" class="tgt"/><line x1="289" y1="304" x2="311" y2="304" class="ctl"/><line x1="300" y1="293" x2="300" y2="315" class="ctl"/></g><g class="gate" style="animation-delay:1.51s"><rect x="383" y="326" width="34" height="28" rx="6" class="gbox"/><text x="400" y="346" class="glabel" text-anchor="middle">R<tspan dy='4' font-size='10'>y</tspan></text></g><g class="gate" style="animation-delay:2.05s"><line x1="500" y1="304" x2="500" y2="351" class="ctl"/><circle cx="500" cy="304" r="5" class="dot"/><circle cx="500" cy="340" r="11" class="tgt"/><line x1="489" y1="340" x2="511" y2="340" class="ctl"/><line x1="500" y1="329" x2="500" y2="351" class="ctl"/></g><g class="gate" style="animation-delay:2.59s"><rect x="583" y="254" width="34" height="28" rx="6" class="gbox"/><text x="600" y="274" class="glabel" text-anchor="middle">H</text></g><g class="gate" style="animation-delay:3.14s"><line x1="700" y1="340" x2="700" y2="279" class="ctl"/><circle cx="700" cy="340" r="5" class="dot"/><circle cx="700" cy="268" r="11" class="tgt"/><line x1="689" y1="268" x2="711" y2="268" class="ctl"/><line x1="700" y1="257" x2="700" y2="279" class="ctl"/></g><g class="gate" style="animation-delay:3.14s"><rect x="683" y="290" width="34" height="28" rx="6" class="gbox"/><text x="700" y="310" class="glabel" text-anchor="middle">Z</text></g><g class="gate" style="animation-delay:3.68s"><rect x="783" y="254" width="34" height="28" rx="6" class="gbox"/><path d="M790 274 A11 11 0 0 1 810 274" class="meter"/><line x1="800" y1="274" x2="808" y2="260" class="meter"/></g><g class="gate" style="animation-delay:3.68s"><rect x="783" y="290" width="34" height="28" rx="6" class="gbox"/><path d="M790 310 A11 11 0 0 1 810 310" class="meter"/><line x1="800" y1="310" x2="808" y2="296" class="meter"/></g><g class="gate" style="animation-delay:3.68s"><rect x="783" y="326" width="34" height="28" rx="6" class="gbox"/><path d="M790 346 A11 11 0 0 1 810 346" class="meter"/><line x1="800" y1="346" x2="808" y2="332" class="meter"/></g>
  
