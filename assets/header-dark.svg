      <animate attributeName="cy" values="138.0;141.8;145.5;149.0;152.1;154.9;157.1;158.7;159.7;160.0;159.7;158.7;157.1;154.9;152.1;149.0;145.5;141.8;138.0;134.2;130.5;127.0;123.9;121.1;118.9;117.3;116.3;116.0;116.3;117.3;118.9;121.1;123.9;127.0;130.5;134.2;138.0" dur="6s" repeatCount="indefinite"/>
